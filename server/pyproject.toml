[project]
name = "cvantage-server"
version = "0.1.0"
description = "CVantage backend service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.116.0",
	"uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
	"httpx>=0.28.0",
	"mypy>=1.10.0",
	"pytest-asyncio>=0.24.0",
	"pytest>=8.2.0",
	"ruff>=0.5.0",
]

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ['^\.venv/']
mypy_path = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
