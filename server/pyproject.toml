[project]
name = "cvantage-server"
version = "0.1.0"
description = "CVantage backend service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"beanie>=1.29.0",
	"email-validator>=2.2.0",
	"fastapi>=0.116.0",
	"pydantic-settings>=2.6.0",
	"psutil>=6.1.0",
	"pymongo>=4.9.0",
	"structlog>=25.4.0",
	"uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
	"httpx>=0.28.0",
	"mypy>=1.10.0",
	"pytest-asyncio>=0.24.0",
	"pytest>=8.2.0",
	"ruff>=0.5.0",
	"types-psutil>=7.0.0.20250601",
]

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/database/models.py" = ["UP", "F401"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ['^\.venv/']
mypy_path = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
