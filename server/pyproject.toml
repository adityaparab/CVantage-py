[project]
name = "cvantage-server"
version = "0.1.0"
description = "CVantage backend service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"aiosmtplib>=4.0.2",
	"argon2-cffi>=25.1.0",
	"authlib>=1.6.0",
	"beanie>=1.29.0",
	"email-validator>=2.2.0",
	"fastapi>=0.116.0",
	"pyjwt>=2.10.1",
	"pydantic-settings>=2.6.0",
	"psutil>=6.1.0",
	"pymongo>=4.9.0",
	"slowapi>=0.1.9",
	"structlog>=25.4.0",
	"typer>=0.17.5",
	"uvicorn>=0.35.0",
	"aiofiles>=24.1.0",
	"s3fs>=2024.12.0",
	"filetype>=1.2.0",
	"python-multipart>=0.0.18",
	"cryptography>=44.0.0",
	"langchain-openai>=0.3.0",
	"tenacity>=9.0.0",
]

[dependency-groups]
dev = [
	"httpx>=0.28.0",
	"hypothesis>=6.155.2",
	"mongomock-motor>=0.0.36",
	"mypy>=1.10.0",
	"pytest-asyncio>=0.24.0",
	"pytest-cov>=7.1.0",
	"pytest>=8.2.0",
	"ruff>=0.5.0",
	"types-psutil>=7.0.0.20250601",
]

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/database/models.py" = ["UP", "F401"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ['^\.venv/']
mypy_path = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
	"unit: unit-level test coverage",
	"e2e: end-to-end style ASGI integration checks",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["app"]
omit = [
	"app/database/*",
	"app/main.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
